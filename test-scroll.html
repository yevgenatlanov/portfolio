<!DOCTYPE html>
<html>
<head>
  <script>
    // Log scroll position every 100ms for 2 seconds
    const logs = [];
    for (let i = 0; i < 20; i++) {
      setTimeout(() => {
        logs.push({ time: i * 100, scrollY: window.scrollY });
        if (i === 19) {
          console.log('Scroll logs:', JSON.stringify(logs, null, 2));
        }
      }, i * 100);
    }
  </script>
</head>
<body>
  <div style="height: 100vh; background: red;">Section 1</div>
  <div style="height: 100vh; background: blue;">Section 2</div>
  <div style="height: 100vh; background: green;">Section 3</div>
</body>
</html>
